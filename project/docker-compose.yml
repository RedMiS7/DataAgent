services:
  mysql:
    image: mysql:8.0
    container_name: dataagent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ADMIN_PASSWORD:-change_me_root}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-execution-time=15000
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ADMIN_PASSWORD:-change_me_root}
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: dataagent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dataagent-app
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ADMIN_PASSWORD:-change_me_root}
      QDRANT_URL: http://qdrant:6333
      LOCAL_ENV_FILE: /config/.env.local
    ports:
      - "8000:8000"
    volumes:
      - app_config:/config
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started

  # The DABench datasets, on their own databases and vector collections. Not started by
  # default: docker compose --profile dabench up -d app-dabench
  app-dabench:
    profiles: ["dabench"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dataagent-app-dabench
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ADMIN_PASSWORD:-change_me_root}
      QDRANT_URL: http://qdrant:6333
      # Keys saved on the web page of the main app are shared.
      LOCAL_ENV_FILE: /config/.env.local
      MYSQL_BUSINESS_DB: dabench
      MYSQL_APP_DB: dataagent_dabench
      QDRANT_COLLECTION_PREFIX: dabench
      SEMANTIC_SEED: seed_dabench
      GENERATE_DEMO_DATA: "false"
    ports:
      - "8001:8000"
    volumes:
      - app_config:/config
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  mysql_data:
  qdrant_data:
  app_config:
